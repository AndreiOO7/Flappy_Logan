<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин — Флаппи Логан</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">ФЛАППИ<span class="logo__dash">-</span>ЛОГАН</a>

    <button class="header__burger" aria-label="Меню" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <nav class="nav" id="mobile-nav">
      <a href="index.html" class="nav__link">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5Z"/>
        </svg>
        Главная
      </a>
      <a href="leaderboard.html" class="nav__link">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M8 21h8"/>
          <path d="M12 17v4"/>
          <path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/>
          <path d="M7 4H4v2a3 3 0 0 0 3 3"/>
          <path d="M17 4h3v2a3 3 0 0 1-3 3"/>
        </svg>
        Таблица лидеров
      </a>
      <a href="catalog.html" class="nav__link nav__link--active">
        <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M6 7h12l-1 10H7L6 7Z"/>
          <path d="M9 7V5a3 3 0 0 1 6 0v2"/>
        </svg>
        Магазин
      </a>
    </nav>

    <div class="header-actions">
      <a href="#" class="header-actions__login" data-auth="login">Войти</a>
      <a href="#" class="header-actions__register" data-auth="register">Регистрация</a>
    </div>
  </header>

  <div class="nav-overlay" id="nav-overlay"></div>

  <main>
    <section class="shop">
      <div class="shop__header">
        <h1 class="shop__title">Магазин</h1>
      </div>
      <!-- Tabs and grid will be rendered by shop.js -->
    </section>
  </main>

  <footer class="footer">
    <div class="footer__brand">
      <a href="index.html" class="footer__logo">ФЛАППИ ЛОГАН</a>
      <p class="footer__tagline">Летай. Уклоняйся. Побеждай.</p>
    </div>
    <p class="footer__copyright">&copy; 2025 Флаппи Логан. Все права защищены.</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
